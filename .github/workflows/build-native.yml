name: Build Android APK and Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build web dist and sync Capacitor
        working-directory: client
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: client/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity-verse-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows EXE (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri EXE
        working-directory: client
        run: npx tauri build

      - name: Upload Windows Standalone Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: infinity-verse-windows-standalone
          path: client/src-tauri/target/release/infinity-verse.exe
