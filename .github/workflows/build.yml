name: Build & Release (On Demand & Push)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy to GitHub Pages'
        type: boolean
        default: true
      build_apk:
        description: 'Build Android APK'
        type: boolean
        default: true
      build_exe:
        description: 'Build Windows Portable EXE'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'build-and-release'
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || inputs.deploy_pages == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build web dist
        working-directory: client
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/dist
          branch: gh-pages

  build-android:
    name: Build Android APK
    if: github.event_name == 'push' || inputs.build_apk == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build web dist and sync Capacitor
        working-directory: client
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: client/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity-verse-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows EXE (Tauri)
    if: github.event_name == 'push' || inputs.build_exe == true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri EXE
        working-directory: client
        run: npx tauri build

      - name: Upload Windows Standalone Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: infinity-verse-windows-standalone
          path: client/src-tauri/target/release/infinity-verse.exe
